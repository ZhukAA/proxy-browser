name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets and PNG icon
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png www/icon.png
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png

      - name: Install Capacitor and add Android platform
        run: |
          npm install
          npx cap init "Proxy Reader" "com.zhuk.proxyreader" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#020617'

      - name: Allow cleartext traffic in Android
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyReader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
